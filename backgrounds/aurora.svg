<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" preserveAspectRatio="none">
  <!-- Aurora: light and dark follow the device -->
  <style>
    .a{stop-color:#c9d3ff}.b{stop-color:#f3c9e3}.c{stop-color:#eef0fb}.d{stop-color:#f8eef3}
    @media (prefers-color-scheme:dark){.a{stop-color:#3a3f7a}.b{stop-color:#6a3b6e}.c{stop-color:#191b2e}.d{stop-color:#241a2b}}
  </style>
  <defs>
    <linearGradient id="l" x1="0" y1="0" x2="0" y2="1"><stop offset="0" class="c"/><stop offset="1" class="d"/></linearGradient>
    <radialGradient id="r1" cx="20" cy="0" r="70" gradientUnits="userSpaceOnUse" gradientTransform="translate(20 0) scale(1.7 1) translate(-20 0)"><stop offset="0" class="a"/><stop offset=".6" class="a" stop-opacity="0"/></radialGradient>
    <radialGradient id="r2" cx="100" cy="40" r="60" gradientUnits="userSpaceOnUse" gradientTransform="translate(100 40) scale(1.5 1) translate(-100 -40)"><stop offset="0" class="b"/><stop offset=".6" class="b" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="100" height="100" fill="url(#l)"/>
  <rect width="100" height="100" fill="url(#r1)"/>
  <rect width="100" height="100" fill="url(#r2)"/>
</svg>
